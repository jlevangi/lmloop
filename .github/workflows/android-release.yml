name: Android signed release

# Distinct `android-v*` tag namespace, not plain `v*`: lmloop's own release
# tagging (if it ever exists) and the Android app's are two independent
# streams sharing one repo, and Obtainium is pointed at this prefix via a
# release-tag filter regex -- see android/README.md.
on:
  push:
    tags: ['android-v*']

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Validate tag and derive Android metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^android-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Tag must match strict android-vMAJOR.MINOR.PATCH' >&2; exit 1; }
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          [[ ${#major} -lt 4 || ( ${#major} -eq 4 && "$major" < "2148" ) ]] || { echo 'Major tag component exceeds range' >&2; exit 1; }
          [[ ${#minor} -le 3 ]] || { echo 'Minor tag component exceeds range' >&2; exit 1; }
          [[ ${#patch} -le 3 ]] || { echo 'Patch tag component exceeds range' >&2; exit 1; }
          code=$((major * 1000000 + minor * 1000 + patch))
          (( code > 0 && code <= 2147483647 )) || { echo 'Tag maps outside positive Int version-code range' >&2; exit 1; }
          printf 'ANDROID_VERSION_NAME=%s\nANDROID_VERSION_CODE=%s\n' "${GITHUB_REF_NAME#android-v}" "$code" >> "$GITHUB_ENV"
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lmloop-android-release.jks"
          chmod 600 "$RUNNER_TEMP/lmloop-android-release.jks"
      - name: Test, lint, and build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/lmloop-android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Verify and package release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#android-v}"
          apk="lmloop-android-${version}.apk"
          sha="lmloop-android-${version}.sha256"
          input=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$input"
          metadata=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$input")
          grep -F "versionCode='${ANDROID_VERSION_CODE}' versionName='${version}'" <<< "$metadata"
          mv "$input" "$apk"
          sha256sum "$apk" > "$sha"
          sha256sum -c "$sha"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lmloop-android-release
          path: android/lmloop-android-*
          if-no-files-found: error
      - name: Delete temporary keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/lmloop-android-release.jks"

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lmloop-android-release
      - name: Verify artifact and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#android-v}"
          apk="lmloop-android-${version}.apk"
          sha="lmloop-android-${version}.sha256"
          test -f "$apk" && test -f "$sha"
          sha256sum -c "$sha"
          # This job has no actions/checkout (deliberately -- it needs no
          # source, only the already-built artifact), so `gh` has no git
          # remote to infer a repo from; --repo makes that explicit rather
          # than relying on one being detected.
          gh release create "$GITHUB_REF_NAME" "$apk" "$sha" --repo "$GITHUB_REPOSITORY" --generate-notes
