name: Python CI

on:
  pull_request:
    paths:
      - '*.py'
      - 'web/**'
      - 'tools/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.github/workflows/python-ci.yml'
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'web/**'
      - 'tools/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.github/workflows/python-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[web]'
      - run: python -m compileall -q . web/
      - run: python -m unittest
      - run: tools/smoke
