# lmloop packages as a flat set of modules rather than a src/ tree, because it
# is also meant to be readable by running it out of a clone -- `python3
# lmloop.py run ...` has to keep working, and a package layout would break that
# for the sake of a convention nothing here needs.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lmloop"
version = "0.1.0"
description = "Hand one objective to a local model and let it work for hours in a git worktree"
readme = "README.md"
requires-python = ">=3.11"          # tomllib
license = { text = "MIT" }
# No runtime dependencies, deliberately: the whole thing is standard library,
# which is what lets it be installed by cloning it and run on a machine that
# has nothing but Python.  See config.py on why the config is TOML.
dependencies = []

[project.optional-dependencies]
# Dashboard integrations: PyJWT and requests provide OIDC; pywebpush provides
# optional Web Push. The unauthenticated dashboard still works on loopback.
web = ["PyJWT[crypto]>=2.7,<3", "requests>=2.31,<3", "pywebpush>=2.0,<3"]

[project.scripts]
lmloop = "lmloop:main"
lmloop-web = "lmloop:web_main"

[tool.setuptools]
py-modules = [
    "lmloop", "loop", "policy", "pi_runner", "runner_stream", "prompts",
    "rundir", "runrecord", "run_history", "run_identity", "attach",
    "gitops", "checks", "models", "browser", "harness", "harness_base",
    "harness_pi", "harness_omp", "harness_opencode", "config", "config_defaults", "env",
    "display", "doctor", "eta", "notify", "prune", "webpush",
]

[tool.setuptools.packages.find]
include = ["web*"]

[tool.setuptools.package-data]
web = ["static/*", "deploy/*"]
