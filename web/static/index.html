<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d1d">
<title>lmloop</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="pulse" id="pulse" aria-hidden="true"></span>
    <div class="brand-text">
      <h1>lmloop</h1>
      <p id="connection">connecting…</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button type="button" id="new-run" class="primary">New run</button>
  </div>
</header>

<nav class="filters" id="filters" aria-label="Filter by project"></nav>

<main>
  <section id="active-section" hidden>
    <h2>Active <span class="count" id="active-count">0</span></h2>
    <div id="active" class="cards"></div>
  </section>

  <section id="finished-section" hidden>
    <h2>Finished <span class="count" id="finished-count">0</span></h2>
    <div id="finished" class="cards"></div>
  </section>

  <p id="empty" class="empty" hidden>
    No runs yet. Start one with <strong>New run</strong>, or from a repo with
    <code>lmloop run "…"</code>.
  </p>
</main>

<!-- Run detail ------------------------------------------------------------->
<dialog id="detail" class="sheet" tabindex="-1">
  <form method="dialog" class="sheet-head">
    <h2 id="detail-title">Run</h2>
    <button class="ghost" value="close" aria-label="Close">✕</button>
  </form>
  <div id="detail-body" class="sheet-body"></div>
</dialog>

<!-- New run ---------------------------------------------------------------->
<dialog id="launch" class="sheet" tabindex="-1">
  <form method="dialog" class="sheet-head">
    <h2>New run</h2>
    <button class="ghost" value="close" aria-label="Close">✕</button>
  </form>
  <form id="launch-form" class="sheet-body">
    <label for="project">Project</label>
    <select id="project" required></select>

    <label for="objective">Objective</label>
    <textarea id="objective" rows="6" required
      placeholder="Something big. The loop breaks it into steps itself — one per iteration."></textarea>
    <p class="hint">Broad is fine and intended. The agent writes a plan first, then works one step at a time.</p>

    <div class="row">
      <div>
        <label for="model">Model</label>
        <select id="model"></select>
      </div>
      <div>
        <label for="thinking">Thinking</label>
        <select id="thinking">
          <option value="">default</option>
          <option value="off">off</option>
          <option value="minimal">minimal</option>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
        </select>
      </div>
      <div>
        <label for="iterations">Iterations</label>
        <input type="number" id="iterations" min="1" max="200" value="20">
      </div>
    </div>

    <p id="launch-error" class="error" hidden></p>
    <button type="submit" class="primary wide" id="launch-submit">Start run</button>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
