<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="lmloop">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>lmloop — sign in</title>
<link rel="stylesheet" href="/static/login.css">
</head>
<body>
<main class="card">
  <!-- A crescent and a few stars, drawn in CSS: the moon is the whole point of
       a loop that keeps working after you have gone to bed. -->
  <div class="sky" aria-hidden="true">
    <div class="moon"><span></span></div>
    <i class="star s1"></i><i class="star s2"></i><i class="star s3"></i><i class="star s4"></i>
  </div>
  <p class="eyebrow">slow models · long nights</p>
  <h1>lmloop</h1>
  <p class="sub">Sign in to start, watch and steer your runs.</p>
  <a class="btn" href="/login/start">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
    Sign in
  </a>
  <p class="error" id="error" hidden></p>
</main>
<script>
  const problem = new URLSearchParams(location.search).get("error");
  if (problem) {
    const box = document.getElementById("error");
    box.textContent = problem;
    box.hidden = false;
  }
</script>
</body>
</html>
