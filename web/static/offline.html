<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0f">
<title>lmloop — offline</title>
<!-- Self-contained on purpose: this is what renders on a phone's very first
     offline visit, before the shell cache exists to serve anything else, so
     it cannot depend on style.css or app.js loading successfully. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    background: #0c0c0f; color: #e7e5df;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    padding: 24px;
  }
  main { max-width: 26rem; text-align: center; }
  .moon {
    display: inline-block; width: 40px; height: 40px; margin-bottom: 16px;
    border-radius: 50%; background: #f0dfa8;
    box-shadow: inset -10px -4px 0 4px #0c0c0f;
  }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 8px; }
  p { color: #9a978d; margin: 0 0 20px; }
  button {
    font: inherit; padding: 10px 18px; border-radius: 4px; border: 1px solid #33312b;
    background: #171613; color: #e7e5df; cursor: pointer;
  }
  button:hover { background: #201f1b; }
</style>
</head>
<body>
<main>
  <span class="moon" aria-hidden="true"></span>
  <h1>No connection</h1>
  <p>lmloop can't reach the server right now. Runs already loaded on this
     device stay visible once you're back online — nothing here was lost.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
